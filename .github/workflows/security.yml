name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Derivar dependencias declaradas desde pyproject.toml
        run: python scripts/export_requirements.py | tee requirements-audit.txt
      - name: pip-audit
        run: python -m pip_audit --strict --progress-spinner off -r requirements-audit.txt

  workflows:
    name: Lint de GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
