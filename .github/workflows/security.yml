name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencias:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Derivar las dependencias declaradas desde pyproject.toml
        # Se audita la lista de dependencias, no el entorno instalado. Auditar el
        # entorno obliga a incluir el propio paquete, que no esta en PyPI: con
        # --strict eso falla, y con --skip-editable tambien, porque --strict
        # trata la omision como error. pyproject.toml es la unica fuente de
        # verdad, asi que la lista se deriva de ahi y no se duplica a mano.
        run: |
          python - <<'PY' > requirements-audit.txt
          import pathlib, tomllib
          d = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = list(d["project"]["dependencies"])
          for extra in d["project"].get("optional-dependencies", {}).values():
              deps += extra
          print("
".join(sorted(set(deps))))
          PY
          cat requirements-audit.txt
      - name: pip-audit
        run: python -m pip_audit --strict --progress-spinner off -r requirements-audit.txt

  workflows:
    name: Lint de GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
