# Catalogo ampliado de instrumentos, familias metodologicas y tecnicas de evaluacion.
#
# QUE ES: fichas DOCUMENTALES. Una ficha NO es un test ejecutable ni un test validado.
# El estado de cada ficha esta en `estado`; solo los instrumentos con `implementacion`
# apuntan a un YAML real de instruments/.
#
# HONESTIDAD DE DATOS: esta primera pasada fija nombre, familia, uso y estado. Toda
# ficha lleva `verificado: false` hasta que alguien contraste titular, licencia,
# version y evidencia contra la fuente primaria. Los campos ausentes significan
# "no verificado", nunca "no existe". No se infieren contenidos desde un nombre.
#
# VALORES
#   familia: A inteligencia | B atencion-memoria-ejecutivas | C personalidad |
#            D laboral | E psicoeducativa | F sociometria | G bienestar | H tecnicas
#   uso: educativo | laboral | clinico | investigacion | orientacion
#   estado: documentado | disponible-legalmente | implementado | en-investigacion |
#           validado-uso-especifico
#   licencia: propietaria | dominio-publico | abierta | no-aplica | no-verificado
defaults:
  verificado: false
  estado: documentado
  licencia: no-verificado
  redistribuible: no-verificado
