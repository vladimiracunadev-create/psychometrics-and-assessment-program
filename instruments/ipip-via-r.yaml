# =========================================================================
# IPIP-VIA-R - Fortalezas del carácter (24 escalas breves)
#
# Los 96 ítems en inglés son DOMINIO PÚBLICO (International Personality
# Item Pool). El marco conceptual es la clasificación VIA de Peterson y
# Seligman (2004); estos ítems son la operacionalización abierta de
# Goldberg, revisada por Bluemke et al. (2021), NO el VIA-IS comercial.
#
# Cada fortaleza tiene 4 ítems con clave equilibrada: 2 directos y 2
# invertidos. Ese equilibrio es lo que contiene el sesgo de aquiescencia,
# y se verifica en tests/test_instrumentos.py.
#
# La traducción al español es de este repositorio y no está baremada.
# Generado por scripts/build_ipip_via_r.py - no editar a mano.
# =========================================================================
codigo: ipip-via-r
version: "1.0.0"
nombre:
  es: Inventario de fortalezas del carácter IPIP-VIA-R
  en: IPIP-VIA-R Character Strengths Inventory
descripcion:
  es: >-
    Mide las 24 fortalezas del carácter de la clasificación VIA,
    agrupadas en 6 virtudes. No evalúa rendimiento ni patología:
    describe qué cualidades del carácter están más presentes en la
    persona. El resultado útil son las fortalezas de firma, es decir las
    más altas del propio perfil, no la comparación escala por escala con
    otras personas.
  en: >-
    Measures the 24 VIA character strengths grouped into 6 virtues.
tipo_respuesta: likert
ipsativo: false
duracion_min: [12, 18]
procedencia:
  autores: Bluemke, M.; Partsch, M. V.; Saucier, G.; Lechner, C. M.; Goldberg, L. R.
  anio: 2021
  fuente: https://ipip.ori.org/IPIP-VIA-R_Key.html
  licencia: dominio-publico
  cita: >-
    Bluemke, M., Partsch, M. V., Saucier, G., & Lechner, C. M. (2021).
    Circumventing cultural bias in the assessment of character strengths:
    IPIP-VIA-R short scales. Marco: Peterson, C., & Seligman, M. E. P.
    (2004). Character Strengths and Virtues.
  notas:
    no_es_via_is: >-
      Este NO es el VIA-IS del VIA Institute, que es propietario. Es la
      medida abierta del IPIP sobre el mismo marco conceptual.
    codigo_humor: >-
      El código original de Humor es HUM y colisiona con el que este
      archivo asigna a la virtud Humanidad; la fortaleza se declara
      como HUM_H.
    fiabilidad: >-
      Los alfas de varias escalas rondan .50-.60. Con 4 ítems es lo
      esperable y sirve para describir un perfil, no para decidir sobre
      una persona. Ver docs/VALIDACION.md.
opciones:
  - valor: 1
    etiqueta: {es: "Muy inexacto", en: "Very Inaccurate"}
  - valor: 2
    etiqueta: {es: "Moderadamente inexacto", en: "Moderately Inaccurate"}
  - valor: 3
    etiqueta: {es: "Ni inexacto ni exacto", en: "Neither Inaccurate nor Accurate"}
  - valor: 4
    etiqueta: {es: "Moderadamente exacto", en: "Moderately Accurate"}
  - valor: 5
    etiqueta: {es: "Muy exacto", en: "Very Accurate"}
escalas:
