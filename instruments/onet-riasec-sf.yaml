# =========================================================================
# O*NET Interest Profiler Short Form - Intereses vocacionales RIASEC
#
# Los 60 ítems son obra del National Center for O*NET Development, patrocinada
# por el U.S. Department of Labor. Como obra del gobierno federal de EE. UU. son
# DOMINIO PÚBLICO y pueden redistribuirse libremente.
#
# Texto en inglés transcrito del Apéndice B (página 35) de:
#   https://www.onetcenter.org/dl_files/IPSF_PP.pdf
#
# La traducción al español es de este repositorio: adapta actividades laborales
# al contexto hispanohablante y NO hereda los baremos originales. Ver
# docs/VALIDACION.md.
#
# NOTA SOBRE EL FORMATO DE RESPUESTA
# La versión lápiz-y-papel usa marcado binario (marca las que te gustaría
# hacer). La versión web usa una Likert de 5 puntos. Aquí se implementa la
# Likert de 5 puntos, que es la forma canónica del IP-SF y conserva más
# información; el modo binario se obtiene dicotomizando en >= 4.
# =========================================================================
codigo: onet-riasec-sf
version: "1.0.0"
nombre:
  es: Perfil de intereses vocacionales O*NET (forma breve)
  en: O*NET Interest Profiler Short Form
descripcion:
  es: >-
    Mide los seis tipos de interés vocacional del modelo de Holland (RIASEC) a
    partir de 60 actividades laborales concretas. No evalúa aptitud ni
    personalidad: mide qué tipo de trabajo resulta atractivo. Es el inventario
    de intereses vocacionales más usado del mundo y la base del sistema de
    exploración ocupacional del Departamento del Trabajo de EE. UU.
  en: >-
    Assesses vocational interests according to Holland's RIASEC types using 60
    concrete work activities.
tipo_respuesta: likert
ipsativo: false
duracion_min: [10, 15]
procedencia:
  autores: Rounds, J.; Su, R.; Lewis, P.; Rivkin, D.; National Center for O*NET Development
  anio: 2010
  fuente: https://www.onetcenter.org/dl_files/IPSF_PP.pdf
  licencia: dominio-publico
  cita: >-
    Rounds, J., Su, R., Lewis, P., & Rivkin, D. (2010). O*NET Interest Profiler
    Short Form Psychometric Characteristics: Summary. National Center for O*NET
    Development. Marco teórico: Holland, J. L. (1997). Making Vocational
    Choices (3.ª ed.).
  notas:
    marco: >-
      Los seis tipos se ordenan en un hexágono: los adyacentes correlacionan
      más que los opuestos. Esa estructura circumpleja es la predicción
      falsable del modelo y se verifica en tests/test_riasec.py.
    codigo_holland: >-
      El resultado útil son las tres puntuaciones más altas en orden, el
      "código Holland" de tres letras, no la puntuación aislada de cada escala.
    traduccion: >-
      Traducción de trabajo de este repositorio, sin estudio de equivalencia
      transcultural.
opciones:
  - valor: 1
    etiqueta: {es: "Me disgusta mucho", en: "Strongly Dislike"}
  - valor: 2
    etiqueta: {es: "Me disgusta", en: "Dislike"}
  - valor: 3
    etiqueta: {es: "Me da igual", en: "Unsure"}
  - valor: 4
    etiqueta: {es: "Me gusta", en: "Like"}
  - valor: 5
    etiqueta: {es: "Me gusta mucho", en: "Strongly Like"}
escalas:
  - codigo: R
    nombre: {es: "Realista", en: "Realistic"}
    descripcion:
      {es: "Trabajo práctico y concreto: herramientas, máquinas, materiales, exterior."}
    polo_bajo: {es: "Poco atractivo el trabajo manual, técnico o al aire libre."}
    polo_alto:
      {es: "Prefiere construir, reparar y operar cosas físicas antes que tratar con ideas o personas."}
    alfa: 0.90
  - codigo: I
    nombre: {es: "Investigador", en: "Investigative"}
    descripcion:
      {es: "Trabajo de análisis: observar, investigar, experimentar, resolver problemas."}
    polo_bajo: {es: "Poco interés por la indagación sistemática y el trabajo científico."}
    polo_alto: {es: "Se orienta a entender por qué ocurren las cosas; disfruta el problema abierto."}
    alfa: 0.93
  - codigo: A
    nombre: {es: "Artístico", en: "Artistic"}
    descripcion:
      {es: "Trabajo de creación y expresión: forma, lenguaje, sonido, imagen."}
    polo_bajo: {es: "Prefiere marcos definidos a la creación libre y ambigua."}
    polo_alto: {es: "Necesita crear y expresar; le pesa el trabajo repetitivo y pautado."}
    alfa: 0.93
  - codigo: S
    nombre: {es: "Social", en: "Social"}
    descripcion:
      {es: "Trabajo con personas: enseñar, cuidar, orientar, ayudar."}
    polo_bajo: {es: "Prefiere trabajar con datos u objetos antes que con personas."}
    polo_alto: {es: "Se realiza acompañando el desarrollo o el bienestar de otros."}
    alfa: 0.93
  - codigo: E
    nombre: {es: "Emprendedor", en: "Enterprising"}
    descripcion:
      {es: "Trabajo de influencia: liderar, vender, negociar, emprender."}
    polo_bajo: {es: "Incómodo en roles de venta, negociación o mando."}
    polo_alto: {es: "Busca dirigir, persuadir y asumir riesgo económico."}
    alfa: 0.90
  - codigo: C
    nombre: {es: "Convencional", en: "Conventional"}
    descripcion:
      {es: "Trabajo de orden: datos, registros, procedimientos, precisión."}
    polo_bajo: {es: "Le pesa el procedimiento estricto y el trabajo administrativo."}
    polo_alto: {es: "Rinde donde hay reglas claras, registros exactos y rutina ordenada."}
    alfa: 0.91
