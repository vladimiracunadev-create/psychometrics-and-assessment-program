# Curriculo del programa. Fuente unica de verdad sobre que clases existen
# y cual es su estado real. scripts/validate_repository.py comprueba que
# lo declarado aqui coincida con el arbol classes/.
# Las clases 001-040 conservan su identificador. Las 041+ las agrego
# scripts/expand_curriculum.py y estan PLANIFICADAS, no escritas.
