<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 16</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 161 a la 170</text><line x1="70" y1="90" x2="830" y2="90" stroke="#a4561b" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#a4561b" stroke="#a4561b" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">161</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Bienestar subjetivo y</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">calidad de vida</text><circle cx="260.0" cy="90" r="26" fill="#a4561b" stroke="#a4561b" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">162</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Estrés percibido</text><circle cx="450.0" cy="90" r="26" fill="#a4561b" stroke="#a4561b" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">163</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Resiliencia y</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">autoeficacia</text><circle cx="640.0" cy="90" r="26" fill="#a4561b" stroke="#a4561b" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">164</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Regulación emocional</text><circle cx="830.0" cy="90" r="26" fill="#a4561b" stroke="#a4561b" stroke-width="3"/><text x="830.0" y=