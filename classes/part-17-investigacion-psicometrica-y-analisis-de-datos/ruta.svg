<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 17</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 171 a la 180</text><line x1="70" y1="90" x2="830" y2="90" stroke="#374151" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">171</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Diseño de un estudio</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">de validación</text><circle cx="260.0" cy="90" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">172</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Tamaño muestral y</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">potencia</text><circle cx="450.0" cy="90" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">173</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Simulación de datos</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">psicométricos</text><circle cx="640.0" cy="90" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">174</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Datos faltantes en</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">instrumentos</text><circle cx="830.0" cy="90" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">175</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">Análisis longitudinal</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">y cambio confiable</text><line x1="70" y1="215" x2="830" y2="215" stroke="#374151" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">176</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Estimación de</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">incertidumbre y</text><text x="70.0" y="293" text-anchor="middle" font-size="12" fill="#222">bootstrap</text><circle cx="260.0" cy="215" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">177</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Funcionamiento</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">diferencial del ítem</text><text x="260.0" y="293" text-anchor="middle" font-size="12" fill="#222">en la práctica</text><circle cx="450.0" cy="215" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">178</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Reproducibilidad:</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">preregistro, datos y</text><text x="450.0" y="293" text-anchor="middle" font-size="12" fill="#222">código</text><circle cx="640.0" cy="215" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">179</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Metaanálisis</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">psicométrico</text><circle cx="830.0" cy="215" r="26" fill="#ffffff" stroke="#374151" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#374151">180</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Redacción y revisión</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">de un informe de</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">validación</text><circle cx="30" cy="312" r="7" fill="#374151"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#374151" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
