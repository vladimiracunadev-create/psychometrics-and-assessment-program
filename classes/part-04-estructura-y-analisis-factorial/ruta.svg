<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 04</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 041 a la 050</text><line x1="70" y1="90" x2="830" y2="90" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">041</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Correlación, matriz y</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">lo que se puede leer</text><text x="70.0" y="168" text-anchor="middle" font-size="12" fill="#222">en ella</text><circle cx="260.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">042</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Análisis factorial</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">exploratorio</text><circle cx="450.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">043</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Análisis factorial</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">confirmatorio y ajuste</text><circle cx="640.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">044</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Modelos circumplejos:</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">el hexágono de Holland</text><text x="640.0" y="168" text-anchor="middle" font-size="12" fill="#222">como predicción…</text><circle cx="830.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">045</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">Invarianza de medida</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">entre grupos</text><line x1="70" y1="215" x2="830" y2="215" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">046</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Rotaciones y criterios</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">de retención de</text><text x="70.0" y="293" text-anchor="middle" font-size="12" fill="#222">factores</text><circle cx="260.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">047</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Ajuste en modelos de</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">ecuaciones</text><text x="260.0" y="293" text-anchor="middle" font-size="12" fill="#222">estructurales</text><circle cx="450.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">048</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Modelos bifactor y</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">jerárquicos</text><circle cx="640.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">049</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Análisis de redes</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">psicométricas</text><circle cx="830.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">050</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Datos ordinales y</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">correlaciones</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">policóricas</text><circle cx="30" cy="312" r="7" fill="#0b6e69"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#0b6e69" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
