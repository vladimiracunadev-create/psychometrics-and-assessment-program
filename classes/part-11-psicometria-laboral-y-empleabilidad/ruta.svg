<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 11</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 111 a la 120</text><line x1="70" y1="90" x2="830" y2="90" stroke="#5a3d99" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#5a3d99" stroke="#5a3d99" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">111</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Análisis de puestos y</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">modelos de</text><text x="70.0" y="168" text-anchor="middle" font-size="12" fill="#222">competencias</text><circle cx="260.0" cy="90" r="26" fill="#5a3d99" stroke="#5a3d99" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">112</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Validez predictiva de</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">los métodos de</text><text x="260.0" y="168" text-anchor="middle" font-size="12" fill="#222">selección</text><circle cx="450.0" cy="90" r="26" fill="#5a3d99" stroke="#5a3d99" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">113</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Pruebas de comprensión</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">de instrucciones</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#222">escritas</text><circle cx="640.0