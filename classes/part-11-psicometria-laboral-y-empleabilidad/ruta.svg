chor="middle" font-size="12" fill="#222">qué se puede y qué no</text><text x="450.0" y="293" text-anchor="middle" font-size="12" fill="#222">afirmar</text><circle cx="640.0" cy="215" r="26" fill="#5a3d99" stroke="#5a3d99" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">119</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Dominio del inglés</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">laboral: evaluación de</text><text x="640.0" y="293" text-anchor="middle" font-size="12" fill="#222">idioma</text><circle cx="830.0" cy="215" r="26" fill="#5a3d99" stroke="#5a3d99" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">120</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Impacto adverso y</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">defensa legal de una</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">decisión de selección</text><circle cx="30" cy="312" r="7" fill="#5a3d99"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#5a3d99" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
