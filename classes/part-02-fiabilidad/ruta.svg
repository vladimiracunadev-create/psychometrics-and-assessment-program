<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 02</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 021 a la 030</text><line x1="70" y1="90" x2="830" y2="90" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">021</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">La teoría clásica:</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">puntaje verdadero y</text><text x="70.0" y="168" text-anchor="middle" font-size="12" fill="#222">error</text><circle cx="260.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">022</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Consistencia interna:</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">alfa de Cronbach y sus</text><text x="260.0" y="168" text-anchor="middle" font-size="12" fill="#222">abusos</text><circle cx="450.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">023</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Omega de McDonald y</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">por qué alfa se queda</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#222">corto</text><circle cx="640.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">024</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Test-retest:</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">estabilidad frente a</text><text x="640.0" y="168" text-anchor="middle" font-size="12" fill="#222">consistencia</text><circle cx="830.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">025</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">Error típico de medida</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">e intervalos de</text><text x="830.0" y="168" text-anchor="middle" font-size="12" fill="#222">confianza del puntaje</text><line x1="70" y1="215" x2="830" y2="215" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">026</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Estadística</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">descriptiva aplicada a</text><text x="70.0" y="293" text-anchor="middle" font-size="12" fill="#222">puntajes</text><circle cx="260.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">027</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Correlación de</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">Pearson, Spearman y</text><text x="260.0" y="293" text-anchor="middle" font-size="12" fill="#222">sus supuestos</text><circle cx="450.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">028</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Fiabilidad de pruebas</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">dicotómicas: KR-20</text><circle cx="640.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">029</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Fiabilidad entre</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">evaluadores: kappa y</text><text x="640.0" y="293" text-anchor="middle" font-size="12" fill="#222">CCI</text><circle cx="830.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">030</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Intervalos de</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">confianza para</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">puntajes individuales</text><circle cx="30" cy="312" r="7" fill="#0b6e69"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#0b6e69" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
