<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Cada defecto rompe un paso de la respuesta</title><desc id="d">Responder un item tiene cuatro pasos; cada defecto de redaccion rompe uno y produce un dato contaminado.</desc><rect width="640" height="360" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="bold" fill="#111">Cada defecto rompe un paso de la respuesta</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect x="24.0" y="110" width="132.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="90.0" y="138" text-anchor="middle" font-size="12" fill="#111">1. Comprender</text><text x="90.0" y="154" text-anchor="middle" font-size="12" fill="#111">el ítem</text><line x1="156.0" y1="155" x2="172.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="90.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">jerga, doble negación</text><rect x="174.0" y="110" width="132.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="240.0" y="138" text-anchor="middle" font-size="12" fill="#111">2. Recordar o</text><text x="240.0" y="154" text-anchor="middle" font-size="12" fill="#111">buscar</text><text x="240.0" y="170" text-anchor="middle" font-size="12" fill="#111">información</text><line x1="306.0" y1="155" x2="322.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="240.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">ambigüedad de frecuencia</text><rect x="324.0" y="110" width="132.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="390.0" y="138" text-anchor="middle" font-size="12" fill="#111">3. Juzgar la</text><text x="390.0" y="154" text-anchor="middle" font-size="12" fill="#111">respuesta</text><line x1="456.0" y1="155" x2="472.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="390.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">absolutos, deseabilidad</text><rect x="474.0" y="110" width="132.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="540.0" y="138" text-anchor="middle" font-size="12" fill="#111">4. Elegir una</text><text x="540.0" y="154" text-anchor="middle" font-size="12" fill="#111">categoría</text><text x="540.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">doble pregunta</text><text x="20" y="300" font-size="11" fill="#5f6368">Cada flecha es un supuesto que puede fallar.</text></svg>
