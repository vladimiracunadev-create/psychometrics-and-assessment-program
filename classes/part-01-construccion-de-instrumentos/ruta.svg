<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 01</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 011 a la 020</text><line x1="70" y1="90" x2="830" y2="90" stroke="#1f4e8c" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">011</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Redacción de ítems:</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">las reglas y por qué</text><text x="70.0" y="168" text-anchor="middle" font-size="12" fill="#222">existen</text><circle cx="260.0" cy="90" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">012</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Formatos de respuesta:</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">Likert, dicotómico,</text><text x="260.0" y="168" text-anchor="middle" font-size="12" fill="#222">continuo</text><circle cx="450.0" cy="90" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">013</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Ipsativo frente a</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">normativo: la trampa</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#222">de la elección forzada</text><circle cx="640.0" cy="90" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">014</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Longitud del test: el</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">intercambio entre</text><text x="640.0" y="168" text-anchor="middle" font-size="12" fill="#222">precisión y abandono</text><circle cx="830.0" cy="90" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">015</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">Pilotaje y análisis</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">clásico de ítems</text><line x1="70" y1="215" x2="830" y2="215" stroke="#1f4e8c" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">016</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Especificaciones de</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">test y tablas de</text><text x="70.0" y="293" text-anchor="middle" font-size="12" fill="#222">contenido</text><circle cx="260.0" cy="215" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">017</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Ítems de opción</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">múltiple: distractores</text><text x="260.0" y="293" text-anchor="middle" font-size="12" fill="#222">y clave</text><circle cx="450.0" cy="215" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">018</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Ítems abiertos,</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">rúbricas y acuerdo</text><text x="450.0" y="293" text-anchor="middle" font-size="12" fill="#222">entre jueces</text><circle cx="640.0" cy="215" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">019</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Juicio de expertos y</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">revisión cognitiva de</text><text x="640.0" y="293" text-anchor="middle" font-size="12" fill="#222">ítems</text><circle cx="830.0" cy="215" r="26" fill="#ffffff" stroke="#1f4e8c" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e8c">020</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Bancos de ítems,</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">versiones y control de</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">cambios</text><circle cx="30" cy="312" r="7" fill="#1f4e8c"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#1f4e8c" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
