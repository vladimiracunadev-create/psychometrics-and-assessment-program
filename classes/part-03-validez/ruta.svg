<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 03</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 031 a la 040</text><line x1="70" y1="90" x2="830" y2="90" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">031</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">La validez no es una</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">propiedad del test, es</text><text x="70.0" y="168" text-anchor="middle" font-size="12" fill="#222">un argumento</text><circle cx="260.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">032</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Validez de contenido y</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">el juicio de expertos</text><circle cx="450.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">033</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Validez de constructo:</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">convergente y</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#222">discriminante</text><circle cx="640.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">034</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Validez de criterio y</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">validez predictiva</text><circle cx="830.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">035</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">La cara olvidada:</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">consecuencias del uso</text><text x="830.0" y="168" text-anchor="middle" font-size="12" fill="#222">del test</text><line x1="70" y1="215" x2="830" y2="215" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">036</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Validez convergente y</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">discriminante: matriz</text><text x="70.0" y="293" text-anchor="middle" font-size="12" fill="#222">multirrasgo-…</text><circle cx="260.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">037</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Validez ecológica y</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">generalización</text><circle cx="450.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">038</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Evidencia basada en</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">procesos de respuesta</text><circle cx="640.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">039</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Metaanálisis de</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">validez y corrección</text><text x="640.0" y="293" text-anchor="middle" font-size="12" fill="#222">por atenuación</text><circle cx="830.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">040</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Amenazas a la validez:</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">falseamiento y</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">deseabilidad social</text><circle cx="30" cy="312" r="7" fill="#0b6e69"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#0b6e69" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
