<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Diferencia de grupos aparente por ítems desplazados</title><desc id="d">Con 5 items desplazados aparece d = 0,38 que no existe en el rasgo; con solo items invariantes d vuelve a casi 0.</desc><rect width="640" height="360" fill="#ffffff"/><line x1="64" x2="620" y1="304.0" y2="304.0" stroke="#e3e3e3"/><text x="56" y="308.0" text-anchor="end" font-size="11" fill="#5f6368">-0.1</text><text x="64.0" y="320" text-anchor="middle" font-size="11" fill="#5f6368">0.5</text><line x1="64" x2="620" y1="251.2" y2="251.2" stroke="#e3e3e3"/><text x="56" y="255.2" text-anchor="end" font-size="11" fill="#5f6368">0.04</text><text x="175.2" y="320" text-anchor="middle" font-size="11" fill="#5f6368">1.5</text><line x1="64" x2="620" y1="198.4" y2="198.4" stroke="#e3e3e3"/><text x="56" y="202.4" text-anchor="end" font-size="11" fill="#5f6368">0.18</text><text x="286.4" y="320" text-anchor="middle" font-size="11" fill="#5f6368">2.5</text><line x1="64" x2="620" y1="145.6" y2="145.6" stroke="#e3e3e3"/><text x="56" y="149.6" text-anchor="end" font-size="11" fill="#5f6368">0.32</text><text x="397.6" y="320" text-anchor="middle" font-size="11" fill="#5f6368">3.5</text><line x1="64" x2="620" y1="92.8" y2="92.8" stroke="#e3e3e3"/><text x="56" y="96.8" text-anchor="end" font-size="11" fill="#5f6368">0.46</text><text x="508.8" y="320" text-anchor="middle" font-size="11" fill="#5f6368">4.5</text><line x1="64" x2="620" y1="40.0" y2="40.0" stroke="#e3e3e3"/><text x="56" y="44.0" text-anchor="end" font-size="11" fill="#5f6368">0.6</text><text x="620.0" y="320" text-anchor="middle" font-size="11" fill="#5f6368">5.5</text><line x1="64" x2="64" y1="40" y2="304" stroke="#333"/><line x1="64" x2="620" y1="304" y2="304" stroke="#333"/><text x="342.0" y="348" text-anchor="middle" font-size="12" fill="#222">Escenario (1 sin desplazar; 2 =