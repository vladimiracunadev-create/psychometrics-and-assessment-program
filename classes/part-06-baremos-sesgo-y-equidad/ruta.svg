<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 06</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 061 a la 070</text><line x1="70" y1="90" x2="830" y2="90" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">061</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Baremos, percentiles y</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">puntajes tipificados</text><circle cx="260.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">062</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">La muestra normativa:</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">a quién se compara la</text><text x="260.0" y="168" text-anchor="middle" font-size="12" fill="#222">persona</text><circle cx="450.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">063</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Funcionamiento</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">diferencial del ítem</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#222">(DIF)</text><circle cx="640.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">064</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Sesgo predictivo y</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">definiciones de</text><text x="640.0" y="168" text-anchor="middle" font-size="12" fill="#222">equidad</text><circle cx="830.0" cy="90" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">065</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">Adaptación</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">transcultural y</text><text x="830.0" y="168" text-anchor="middle" font-size="12" fill="#222">equivalencia</text><line x1="70" y1="215" x2="830" y2="215" stroke="#0b6e69" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">066</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Puntajes estándar: z,</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">T y estaninos</text><circle cx="260.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">067</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Normas por edad y por</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">curso escolar</text><circle cx="450.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">068</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Equidad en</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">evaluaciones de alto</text><text x="450.0" y="293" text-anchor="middle" font-size="12" fill="#222">impacto</text><circle cx="640.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">069</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Acomodaciones y diseño</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">universal de la</text><text x="640.0" y="293" text-anchor="middle" font-size="12" fill="#222">evaluación</text><circle cx="830.0" cy="215" r="26" fill="#0b6e69" stroke="#0b6e69" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">070</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Estudios de invarianza</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">entre grupos</text><circle cx="30" cy="312" r="7" fill="#0b6e69"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#0b6e69" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
