<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">De lo que no se ve a un puntaje</title><desc id="d">Cadena de seis pasos: rasgo, conducta, item, respuesta, puntaje e interpretacion. Cada paso es un supuesto.</desc><rect width="640" height="360" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="bold" fill="#111">De lo que no se ve a un puntaje</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect x="24.0" y="110" width="82.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="65.0" y="138" text-anchor="middle" font-size="12" fill="#111">Rasgo (no</text><text x="65.0" y="154" text-anchor="middle" font-size="12" fill="#111">observable)</text><line x1="106.0" y1="155" x2="122.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="65.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">se postula</text><rect x="124.0" y="110" width="82.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="165.0" y="138" text-anchor="middle" font-size="12" fill="#111">Conducta que</text><text x="165.0" y="154" text-anchor="middle" font-size="12" fill="#111">lo manifiesta</text><line x1="206.0" y1="155" x2="222.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="165.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">se supone</text><rect x="224.0" y="110" width="82.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="265.0" y="138" text-anchor="middle" font-size="12" fill="#111">Item que la</text><text x="265.0" y="154" text-anchor="middle" font-size="12" fill="#111">pregunta</text><line x1="306.0" y1="155" x2="322.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="265.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">se redacta</text><rect x="324.0" y="110" width="82.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="365.0" y="138" text-anchor="middle" font-size="12" fill="#111">Respuesta</text><text x="365.0" y="154" text-anchor="middle" font-size="12" fill="#111">marcada</text><line x1="406.0" y1="155" x2="422.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="365.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">se observa</text><rect x="424.0" y="110" width="82.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="465.0" y="138" text-anchor="middle" font-size="12" fill="#111">Puntaje total</text><line x1="506.0" y1="155" x2="522.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="465.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">se calcula</text><rect x="524.0" y="110" width="82.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="565.0" y="138" text-anchor="middle" font-size="12" fill="#111"></text><text x="565.0" y="154" text-anchor="middle" font-size="12" fill="#111">Interpretacion</text><text x="565.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">se infiere</text><text x="20" y="300" font-size="11" fill="#5f6368">Cada flecha es un supuesto que puede fallar.</text></svg>
