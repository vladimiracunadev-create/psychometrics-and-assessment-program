<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Las piezas de un cuestionario</title><desc id="d">Un instrumento contiene escalas; cada escala agrupa items; la persona da respuestas y de ellas sale un puntaje por escala.</desc><rect width="640" height="360" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="bold" fill="#111">Las piezas de un cuestionario</text><defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker></defs><rect x="24.0" y="110" width="102.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="75.0" y="138" text-anchor="middle" font-size="12" fill="#111">Instrumento</text><text x="75.0" y="154" text-anchor="middle" font-size="12" fill="#111">(el</text><text x="75.0" y="170" text-anchor="middle" font-size="12" fill="#111">cuestionario)</text><line x1="126.0" y1="155" x2="142.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="75.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">ej.: IPIP-NEO-120</text><rect x="144.0" y="110" width="102.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="195.0" y="138" text-anchor="middle" font-size="12" fill="#111">Escalas (cada</text><text x="195.0" y="154" text-anchor="middle" font-size="12" fill="#111">rasgo)</text><line x1="246.0" y1="155" x2="262.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="195.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">ej.: Responsabilidad</text><rect x="264.0" y="110" width="102.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="315.0" y="138" text-anchor="middle" font-size="12" fill="#111">Ítems (las</text><text x="315.0" y="154" text-anchor="middle" font-size="12" fill="#111">preguntas)</text><line x1="366.0" y1="155" x2="382.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="315.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">ej.: «Termino lo que empiezo»</text><rect x="384.0" y="110" width="102.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="435.0" y="138" text-anchor="middle" font-size="12" fill="#111">Respuestas (lo</text><text x="435.0" y="154" text-anchor="middle" font-size="12" fill="#111">que marcas)</text><line x1="486.0" y1="155" x2="502.0" y2="155" stroke="#5f6368" stroke-width="2" marker-end="url(#f)"/><text x="435.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">ej.: 1 a 5</text><rect x="504.0" y="110" width="102.0" height="90" rx="8" fill="#eef3fb" stroke="#1f5fbf"/><text x="555.0" y="138" text-anchor="middle" font-size="12" fill="#111">Puntaje (un</text><text x="555.0" y="154" text-anchor="middle" font-size="12" fill="#111">número por</text><text x="555.0" y="170" text-anchor="middle" font-size="12" fill="#111">escala)</text><text x="555.0" y="225" text-anchor="middle" font-size="11" fill="#b3261e">ej.: media 3,8</text><text x="20" y="300" font-size="11" fill="#5f6368">Cada flecha es un supuesto que puede fallar.</text></svg>
