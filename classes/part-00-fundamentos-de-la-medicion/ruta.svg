<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">Ruta de la parte 00</title><desc id="d">Diez clases en secuencia; el círculo lleno indica formato pedagógico completo.</desc><rect width="900" height="330" rx="14" fill="#f7f8fa" stroke="#d9dde3"/><text x="24" y="32" font-size="16" font-weight="bold" fill="#111">Ruta de estudio · de la clase 001 a la 010</text><line x1="70" y1="90" x2="830" y2="90" stroke="#1f4e8c" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="90" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="70.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">001</text><text x="70.0" y="138" text-anchor="middle" font-size="12" fill="#222">Qué significa medir lo</text><text x="70.0" y="153" text-anchor="middle" font-size="12" fill="#222">que no se ve</text><circle cx="260.0" cy="90" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="260.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">002</text><text x="260.0" y="138" text-anchor="middle" font-size="12" fill="#222">Del constructo al</text><text x="260.0" y="153" text-anchor="middle" font-size="12" fill="#222">ítem: cómo nace una</text><text x="260.0" y="168" text-anchor="middle" font-size="12" fill="#222">pregunta</text><circle cx="450.0" cy="90" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="450.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">003</text><text x="450.0" y="138" text-anchor="middle" font-size="12" fill="#222">Escalas de medida y</text><text x="450.0" y="153" text-anchor="middle" font-size="12" fill="#222">qué operaciones</text><text x="450.0" y="168" text-anchor="middle" font-size="12" fill="#222">permiten</text><circle cx="640.0" cy="90" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="640.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">004</text><text x="640.0" y="138" text-anchor="middle" font-size="12" fill="#222">Puntaje bruto, media</text><text x="640.0" y="153" text-anchor="middle" font-size="12" fill="#222">por ítem y por qué no</text><text x="640.0" y="168" text-anchor="middle" font-size="12" fill="#222">son lo mismo</text><circle cx="830.0" cy="90" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="830.0" y="96" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">005</text><text x="830.0" y="138" text-anchor="middle" font-size="12" fill="#222">Ítems invertidos y</text><text x="830.0" y="153" text-anchor="middle" font-size="12" fill="#222">sesgo de aquiescencia</text><line x1="70" y1="215" x2="830" y2="215" stroke="#1f4e8c" stroke-width="4" stroke-opacity=".35"/><circle cx="70.0" cy="215" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="70.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">006</text><text x="70.0" y="263" text-anchor="middle" font-size="12" fill="#222">Historia de la</text><text x="70.0" y="278" text-anchor="middle" font-size="12" fill="#222">psicometría: de Galton</text><text x="70.0" y="293" text-anchor="middle" font-size="12" fill="#222">a la medición moderna</text><circle cx="260.0" cy="215" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="260.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">007</text><text x="260.0" y="263" text-anchor="middle" font-size="12" fill="#222">Constructos, variables</text><text x="260.0" y="278" text-anchor="middle" font-size="12" fill="#222">latentes y</text><text x="260.0" y="293" text-anchor="middle" font-size="12" fill="#222">definiciones…</text><circle cx="450.0" cy="215" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="450.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">008</text><text x="450.0" y="263" text-anchor="middle" font-size="12" fill="#222">Tipos de test:</text><text x="450.0" y="278" text-anchor="middle" font-size="12" fill="#222">rendimiento máximo</text><text x="450.0" y="293" text-anchor="middle" font-size="12" fill="#222">frente a desempeño…</text><circle cx="640.0" cy="215" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="640.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">009</text><text x="640.0" y="263" text-anchor="middle" font-size="12" fill="#222">Pruebas de velocidad,</text><text x="640.0" y="278" text-anchor="middle" font-size="12" fill="#222">de potencia y tareas</text><text x="640.0" y="293" text-anchor="middle" font-size="12" fill="#222">cronometradas</text><circle cx="830.0" cy="215" r="26" fill="#1f4e8c" stroke="#1f4e8c" stroke-width="3"/><text x="830.0" y="221" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">010</text><text x="830.0" y="263" text-anchor="middle" font-size="12" fill="#222">Introducción a la</text><text x="830.0" y="278" text-anchor="middle" font-size="12" fill="#222">estadística</text><text x="830.0" y="293" text-anchor="middle" font-size="12" fill="#222">descriptiva para…</text><circle cx="30" cy="312" r="7" fill="#1f4e8c"/><text x="44" y="317" font-size="12" fill="#333">formato pedagógico completo</text><circle cx="260" cy="312" r="7" fill="#fff" stroke="#1f4e8c" stroke-width="2.5"/><text x="274" y="317" font-size="12" fill="#333">formato compacto (en reescritura)</text></svg>
